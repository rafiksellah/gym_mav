twig:
    file_name_pattern: '*.twig'
    globals:
        company_name: '%app.company_name%'
        company_tagline: '%app.company_tagline%'
        whatsapp_number: '%app.whatsapp_number%'
        phone_number: '%app.phone_number%'
        contact_email: '%app.contact_email%'
        technical_phone: '%app.technical_phone%'
        technical_phone_intl: '%app.technical_phone_intl%'
        technical_email: '%app.technical_email%'
        company_address: '%app.company_address%'
        opening_hours: '%app.opening_hours%'
        facebook_url: '%app.facebook_url%'
        instagram_url: '%app.instagram_url%'
        google_maps_embed_url: '%app.google_maps_embed_url%'

when@test:
    twig:
        strict_variables: true
