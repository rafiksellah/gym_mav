# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Bump this string whenever a static CSS/JS file under public/assets changes,
    # so it gets a new ?v= query string and bypasses the host's aggressive caching.
    assets:
        version: 'v3'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
